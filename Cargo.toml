[workspace]
members = [".", "dsp", "xtask", "tools/testkit"]
# Patched dependencies, see vendor/README.md
exclude = ["vendor"]
resolver = "2"

[package]
name = "klopfer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A drum sampler plugin (VST3/CLAP)"

[lib]
# The lib artifact is needed for the standalone binary and for tests
crate-type = ["cdylib", "lib"]

[[bin]]
name = "klopfer_standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = []
standalone = ["nice-plug/standalone", "dep:cpal", "dep:jack"]

[dependencies]
atomic_float = "1.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Only used by the standalone binary to pick the output device's sample rate
cpal = { version = "0.18", optional = true }
# Only used by the standalone binary to read the JACK server's sample rate
jack = { version = "0.13.5", optional = true }
crossbeam-queue = "0.3.14"
dirs = { version = "7.0.0", default-features = false }
hound = "3.5.1"
klopfer_dsp = { path = "dsp" }
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.5.1"
# Same version as nice-plug-egui's
egui = "0.36.2"
parking_lot = "0.12.5"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "flac", "ogg", "vorbis", "mp3", "pcm"] }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"

# Local copies with fixes, see vendor/README.md
[patch.crates-io]
baseview = { path = "vendor/baseview" }
egui-baseview = { path = "vendor/egui-baseview" }
nice-plug = { path = "vendor/nice-plug" }
